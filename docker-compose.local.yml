# docker-compose.local.yml
# Spins up a local, unauthenticated Kafka + Elasticsearch so you can verify
# the WHOLE pipeline works correctly before signing up for any cloud free
# tier. This is purely for local testing -- the Deployment section of the
# README still uses real Upstash Kafka + Bonsai Elasticsearch, because
# Render can't reach a Kafka broker running on your laptop.
#
# Run with:  docker compose -f docker-compose.local.yml up -d
# Stop with: docker compose -f docker-compose.local.yml down -v

version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
